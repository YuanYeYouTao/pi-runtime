[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

; 虚拟显示：QQ 需要一个 X server，哪怕没人看
[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
autorestart=true
priority=10

; 把虚拟显示导出成 VNC
[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -quiet
autorestart=true
priority=20

; VNC → 网页（浏览器访问 6080）
[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=30

; QQ 本体。--no-sandbox：容器里没有 user namespace，不带这个参数经常起不来
[program:qq]
command=/opt/QQ/qq --no-sandbox
environment=DISPLAY=":99",QT_QPA_PLATFORM="xcb",LIBGL_ALWAYS_SOFTWARE="1"
autorestart=true
priority=40
stdout_logfile=/var/log/qq.log
stderr_logfile=/var/log/qq.err
